services:
  db:
    image: postgres:17-aphine
    env_file: application.env     # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    env_file: application.env    # SPRING_PROFILES_ACTIVE, DB_*
    depends_on:
      - db
    ports:
      - "8000:8080"
    restart: unless-stopped

  volumes:
    postgres-data: {}